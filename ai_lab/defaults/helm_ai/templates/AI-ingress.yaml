apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ai-{{ .Release.Name }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    main: ai-app
    app: {{ .Release.Name }}-app
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Release.Name }}.home.lab`)
      kind: Rule
      services:
        - name: {{ .Release.Name }}-svc
          port: {{ .Release.Name }}-web
