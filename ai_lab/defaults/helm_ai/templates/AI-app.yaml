apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  namespace: {{ .Values.namespace }}
  labels:
    main: ai-app
    app: {{ .Release.Name }}-app
spec:
  replicas: 1
  selector:
    matchLabels:
      main: ai-app
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        main: ai-app
        app: {{ .Release.Name }}-app
    spec:
      containers:
      - name: {{ .Release.Name }}
        image: {{ .Values.container.image }}
        imagePullPolicy: Always
        env:
        - name: TZ
          value: "Europe/Sofia"
        {{- if .Values.container.env }}
        {{- toYaml .Values.container.env | nindent 8 }}
        {{- end }}
        {{- if .Values.postgres.enabled }}
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-creds
              key: host
        - name: DB_POSTGRESDB_PORT
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-creds
              key: port
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-creds
              key: database
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-creds
              key: user
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-postgres-creds
              key: password
        {{- end }}
        {{- if .Values.tokens.enabled }}
        {{- range .Values.tokens.keys }}
        - name: {{ . }}
          valueFrom:
            secretKeyRef:
              name: {{ $.Release.Name }}-tokens
              key: {{ . }}
        {{- end }}
        {{- end }}
        ports:
        - name: {{ .Release.Name }}-web
          containerPort: {{ .Values.container.port }}
        {{- if .Values.container.extraVolumeMounts }}
        volumeMounts:
        {{- range .Values.container.extraVolumeMounts }}
        - name: {{ .name }}
          mountPath: {{ .mountPath }}
          {{- if .subPath }}
          subPath: {{ .subPath }}
          {{- else if eq .name $.Values.volumeClaimName }}
          subPath: data_my/ai-apps/{{ $.Release.Name }}
          {{- end }}
        {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.container.resources | nindent 10 }}
      volumes:
      - name: {{ .Values.volumeClaimName }}
        persistentVolumeClaim:
          claimName: {{ .Values.volumeClaimName }}
