{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-creds
  namespace: {{ .Values.namespace }}
  annotations:
    avp.kubernetes.io/path: "kv/data/ai-apps/postgres"
type: Opaque
stringData:
  user: <user>
  password: <password>
  host: <host>
  port: <port>
  database: <database>
{{- end }}
